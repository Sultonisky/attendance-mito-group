name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://attendance.mito.co.id/api/v1
          VITE_GPS_MAX_ACCURACY_METERS: 100
        run: npm run build

  backend:
    name: Backend Checks + PHPUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-laravel

    # Job-level env applies to EVERY step (composer install included), so
    # artisan tooling that boots the app (package:discover on
    # post-autoload-dump) always sees sqlite :memory: instead of falling
    # back to config/database.php's database.sqlite file default or a
    # stray local .env (which is gitignored and absent on runners, but the
    # env below makes that irrelevant either way).
    env:
      APP_ENV: testing
      APP_KEY: base64:L798DnI+AaGiIccxWqMOHoi6U2Jqh90QyKVxYRFyNmc=
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 4
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend-laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare Laravel storage directories
        # storage/* and bootstrap/cache are gitignored, so a fresh checkout
        # has none of them. Anything that boots the view layer
        # (e.g. GET /up rendering an exception page) throws
        # "Please provide a valid cache path" without these.
        # Mirrors what Dockerfile creates for the production image.
        run: |
          mkdir -p \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

      - name: PHP Syntax Check
        run: find app routes config database -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit (sqlite in-memory)
        # phpunit.xml already forces the same sqlite :memory: + array
        # cache/session/queue values, so this job needs no external
        # DB/Redis service.
        run: vendor/bin/phpunit --colors=never

  ai-service:
    name: AI Service Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    env:
      # Deterministic test-only secret. Matches what ai-service/tests/*.py
      # already set via os.environ.setdefault — set explicitly here so CI
      # never falls back to .env or a dev-only default.
      AI_API_KEY: test-secret-key-123
      # Force the deterministic in-memory biometric store. Never point CI at a
      # real Postgres — embeddings are ephemeral test fixtures.
      AI_BIOMETRIC_DATABASE_URL: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production seed data files exist
        # Dockerfile COPY + deploy import depend on these paths.
        run: |
          test -f data/stores.json
          python -c "import json; d=json.load(open('data/stores.json',encoding='utf-8')); assert isinstance(d,list) and len(d)>0"

      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://attendance.mito.co.id/api/v1 \
            --build-arg VITE_GPS_MAX_ACCURACY_METERS=100 \
            -t hris-attendance:ci \
            .

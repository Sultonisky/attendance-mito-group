name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: attendance-production
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://attendance.mito.co.id/api/v1
  VITE_GPS_MAX_ACCURACY_METERS: 100

jobs:
  deploy:
    name: Deploy Production
    # workflow_run fires when the CI run *completes* (success OR failure),
    # so the conclusion check below is the real gate. All four CI jobs
    # (frontend, backend, ai-service, docker) must pass before this runs.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20

    steps:
      # Pin the exact commit CI tested. The old script ran
      # `git reset --hard origin/main`, which races with newer pushes:
      # a commit pushed after CI passed could be deployed untested.
      # `github.event.workflow_run.head_sha` is the tested commit.
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify CI commit matches branch tip
        id: pin
        run: |
          TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Tested commit: $TESTED_SHA"
          git fetch origin main --quiet
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Main tip:      $MAIN_SHA"
          if [ "$TESTED_SHA" != "$MAIN_SHA" ]; then
            echo "::warning::Tested commit ($TESTED_SHA) is behind main ($MAIN_SHA). Refusing to deploy untested code."
            exit 1
          fi
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH-OK"

      # IMPORTANT (regression since PR #37):
      # `ssh host <<EOF` + `docker compose exec` will attach the heredoc as the
      # exec process stdin. After `artisan down`, the remainder of the deploy
      # script is consumed as stdin and never run by the shell — Actions still
      # exits 0, `latest` is retagged, container is NOT recreated.
      # Fix: `bash -s` + quoted heredoc, and `</dev/null` on every compose exec.
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TESTED_SHA: ${{ steps.pin.outputs.sha }}
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_GPS_MAX_ACCURACY_METERS: ${{ env.VITE_GPS_MAX_ACCURACY_METERS }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "TESTED_SHA=$(printf %q "$TESTED_SHA") VITE_API_BASE_URL=$(printf %q "$VITE_API_BASE_URL") VITE_GPS_MAX_ACCURACY_METERS=$(printf %q "$VITE_GPS_MAX_ACCURACY_METERS") bash -s" <<'EOF'
          set -euo pipefail

          echo "======================================"
          echo "      MITO ATTENDANCE DEPLOY"
          echo "      Tested commit: $TESTED_SHA"
          echo "======================================"

          echo "==> Updating source to tested commit"
          cd /opt/attendance-src

          git fetch origin main
          git reset --hard "$TESTED_SHA"

          echo "==> Verifying checkout"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

          echo "==> Building production image"
          docker build \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg VITE_GPS_MAX_ACCURACY_METERS="$VITE_GPS_MAX_ACCURACY_METERS" \
            -t "hris-attendance:$TESTED_SHA" \
            -t hris-attendance:latest \
            /opt/attendance-src

          cd /opt/attendance

          echo "==> Pre-deploy database backup (pg_dump)"
          # Runs before maintenance mode: if the backup fails the deploy aborts
          # while prod is still UP on the old version. pg_dump reads one
          # consistent snapshot, so concurrent writes are safe.
          # Restore (overwrites current data!):
          #   docker compose exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists' < backups/<file>.dump
          BACKUP_DIR=/opt/attendance/backups
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)-${TESTED_SHA:0:12}.dump"
          docker compose exec -T postgres \
            sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' </dev/null > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          chmod 600 "$BACKUP_FILE"
          echo "Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
          # Keep the 14 most recent pre-deploy dumps.
          ls -1t "$BACKUP_DIR"/pre-deploy-*.dump | tail -n +15 | xargs -r rm -f --

          echo "==> Enabling maintenance mode"
          # storage is a bind mount — down flag survives container recreate.
          # Do NOT call mito:maintenance on the OLD image (chicken-and-egg).
          # </dev/null is mandatory so compose exec cannot eat the deploy script.
          # If this script exits before "Disabling maintenance mode", prod stays
          # DOWN on purpose. Bring it up manually:
          #   docker compose exec -T attendance php artisan up </dev/null
          docker compose exec -T attendance php artisan down --retry=60 </dev/null

          echo "==> Recreating attendance container"
          docker compose up -d \
            --no-deps \
            --force-recreate \
            attendance

          echo "==> Verifying running container uses the tested image"
          EXPECTED_IMAGE_ID="$(docker image inspect -f '{{.Id}}' "hris-attendance:$TESTED_SHA")"
          RUNNING_IMAGE_ID="$(docker inspect -f '{{.Image}}' hris-attendance)"
          echo "Expected: $EXPECTED_IMAGE_ID"
          echo "Running:  $RUNNING_IMAGE_ID"
          if [ "$RUNNING_IMAGE_ID" != "$EXPECTED_IMAGE_ID" ]; then
            echo "ERROR: container is still on an old image after --force-recreate."
            docker ps --filter name=hris-attendance
            docker compose images attendance || true
            exit 1
          fi
          echo "Container image matches tested commit $TESTED_SHA."

          echo "==> Waiting for artisan inside container"
          for i in $(seq 1 24); do
            if docker compose exec -T attendance php artisan about </dev/null > /dev/null 2>&1; then
              echo "Artisan ready (attempt $i)."
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "Artisan NOT ready after 24 attempts."
              docker compose logs --tail=100 attendance
              exit 1
            fi
            sleep 5
          done

          echo "==> Verifying mito:maintenance shipped in this image"
          if docker compose exec -T attendance \
            test -f /var/www/html/app/Console/Commands/MitoMaintenanceCommand.php </dev/null \
            && docker compose exec -T attendance php artisan list mito </dev/null > /dev/null 2>&1; then
            echo "mito:maintenance is registered."
          else
            echo "WARNING: mito:maintenance missing from image — deploy continues with native artisan up/down only."
          fi

          echo "==> Running database migrations"
          docker compose exec -T attendance \
            php artisan migrate --force </dev/null

          echo "==> Seeding roles, permissions and initial dashboard users (idempotent)"
          # Full DatabaseSeeder: RBAC baseline + initial dashboard accounts
          # (hisar.hesti@ ADMIN, reginald.hirawan@ SUPER_ADMIN, plus demo
          # superadmin@ / admin@ / user@mito.co.id). Accounts are seeded only
          # while the users table is empty; afterwards the Users page (DB) owns
          # them. Access is per user (role = template); dashboard edits are kept
          # and the seeder only adds permissions new in this release. If no active
          # SUPER_ADMIN exists, superadmin@ is restored (lockout guard). Dummy demo data
          # (DevelopmentDataSeeder) is skipped outside APP_ENV=local.
          # Set SEED_USER_PASSWORD in the container .env to override the
          # default seeded password.
          docker compose exec -T attendance \
            php artisan db:seed --force </dev/null

          # Outsource master data (persons, cabang, pins, allowlists) is NOT
          # touched by deploys. PostgreSQL — managed via the dashboard — is the
          # only source of truth; data/stores.json is a local/dev seed and is
          # never imported into production automatically.

          echo "==> Waiting for nginx container health (not Laravel readiness)"
          for i in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:8081/health > /dev/null; then
              echo "Nginx health passed (attempt $i)."
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Nginx health FAILED after 12 attempts."
              docker compose logs --tail=100 attendance
              exit 1
            fi
            sleep 5
          done

          echo "==> Disabling maintenance mode"
          # Native up is authoritative. mito:maintenance up is best-effort after
          # recreate (resets public/maintenance.json to enabled:false when present).
          docker compose exec -T attendance php artisan up </dev/null
          docker compose exec -T attendance php artisan mito:maintenance up \
            </dev/null > /dev/null 2>&1 || true

          if docker compose exec -T attendance \
            test -f /var/www/html/storage/framework/down </dev/null; then
            echo "ERROR: storage/framework/down still present after artisan up"
            docker compose exec -T attendance php artisan up </dev/null
            docker compose exec -T attendance \
              test ! -f /var/www/html/storage/framework/down </dev/null
          fi

          echo
          echo "==> Laravel API health"
          curl --fail --silent http://127.0.0.1:8081/api/v1/health
          echo

          echo
          echo "==> Laravel -> AI health"
          curl --fail --silent http://127.0.0.1:8081/api/v1/ai-health
          echo

          echo
          echo "==> Container status"
          docker ps \
            --filter name=hris-attendance \
            --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.ID}}'

          echo
          echo "======================================"
          echo "      DEPLOYMENT SUCCESSFUL ($TESTED_SHA)"
          echo "======================================"
          EOF
